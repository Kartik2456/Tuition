<body style="background: #111; color: white; font-family: sans-serif; padding: 20px;">

    <script>
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                const masterEmail = "ganeshthapa1420@gmail.com"; 
                
                if (user.email !== masterEmail) {
                    alert("ACCESS DENIED: Master Admin privileges required.");
                    window.location.href = "dashboard.html"; 
                } else {
                    // Unlock the page and trigger the Account Fetcher!
                    document.getElementById('vault-content').style.display = 'block';
                    document.getElementById('admin-email-display').innerText = user.email;
                    loadAllAccounts(); // This is the new magic command!
                }
            } else {
                window.location.href = "index.html"; 
            }
        });
    </script>

    <div id="vault-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="color: cyan; margin: 0; font-size: 22px;">Master Admin</h1>
            <button onclick="window.location.href='dashboard.html'" style="background: #333; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 5px; font-weight: bold;">Exit Vault</button>
        </div>
        <p style="margin-top: 5px; font-size: 13px;">Welcome, <span id="admin-email-display" style="color: yellow;"></span></p>
        <hr style="border-color: #333;">
        
        <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 15px;">
            
            <div style="background: #222; padding: 15px; border-radius: 8px;">
                <h3 style="color: cyan; margin-top: 0; margin-bottom: 10px;">Registered Tutors</h3>
                
                <!-- Notice there is NO 'overflow-x' or 'flex' here anymore! -->
                <div id="master-database-viewer">
                    <p style="color: #888;">Fetching all accounts...</p>
                </div>
            </div>

            <div style="background: #222; padding: 15px; border-radius: 8px; min-height: 50vh;">
                <h3 style="color: var(--green, #4CAF50); margin-top: 0;">Group Data</h3>
                <div id="group-viewer">
                    <p style="color: #888;">Tap a tutor above to view their groups and attendance records...</p>
                </div>
            </div>
        </div>
    </div>
   <!-- THE BRAIN -->
    <script>
        // FUNCTION 1: Fetch all users
        async function loadAllAccounts() {
            const viewer = document.getElementById('master-database-viewer');
            viewer.innerHTML = ''; 
            
            try {
                const snapshot = await db.collection('users').get();
                
                if (snapshot.empty) {
                    viewer.innerHTML = '<p>No users found.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const userData = doc.data();
                    const userName = userData.name || "Unknown Name";
                    const userEmail = userData.email || "No Email";
                    const uid = doc.id; 

                    // UPDATE: We are now passing the userEmail into the onclick function too!
                    const userCard = `
                        <div style="padding: 12px 0; border-bottom: 1px solid #333; cursor: pointer;" 
                             onclick="loadUserGroups('${uid}', '${userName}', '${userEmail}')">
                            <div style="color: white; font-size: 16px; margin-bottom: 3px;">${userName}</div>
                            <div style="color: #b388ff; font-size: 13px;">${userEmail}</div>
                        </div>
                    `;
                    viewer.innerHTML += userCard;
                });
                
            } catch (error) {
                console.error("Error fetching users:", error);
                viewer.innerHTML = '<p style="color: red;">Error loading accounts.</p>';
            }
        }

       // FUNCTION 3: Fetch Students and Attendance for the clicked group
        async function loadGroupDetails(groupId, groupName) {
            const groupViewer = document.getElementById('group-viewer');
            groupViewer.innerHTML = `<p style="color: yellow;">Unlocking data for <b>${groupName}</b>...</p>`;
            
            try {
                // 1. Fetch the Students
                const studentSnap = await db.collection('students').where('groupId', '==', groupId).get();
                let studentsHTML = '';
                
                if (studentSnap.empty) {
                    studentsHTML = '<p style="color: #888; font-size: 14px;">No students enrolled yet.</p>';
                } else {
                    studentSnap.forEach(doc => {
                        const data = doc.data();
                        const studentName = data.name || "Unknown Student";
                        const studentClass = data.class || "N/A";
                        studentsHTML += `<div style="padding: 8px 0; border-bottom: 1px solid #333; color: white;">🧑‍🎓 ${studentName} <span style="color: #888; font-size: 12px;">(Class: ${studentClass})</span></div>`;
                    });
                }

                // 2. Fetch the Attendance
                const attendanceSnap = await db.collection('attendance').where('groupId', '==', groupId).get();
                let attendanceHTML = '';
                
                if (attendanceSnap.empty) {
                    attendanceHTML = '<p style="color: #888; font-size: 14px; line-height: 1.5;">No records found.<br><span style="font-size: 11px; color: #ff5252;">(Note: Ensure your app saves the "groupId" inside new attendance records!)</span></p>';
            }else {
                    attendanceSnap.forEach(doc => {
                        const data = doc.data();
                        const date = data.date || doc.id; // Fallback to document ID if date field is missing
                        attendanceHTML += `<div style="padding: 8px 0; border-bottom: 1px solid #333; color: #b388ff;">📅 ${date}</div>`;
                    });
                }

                // 3. Build the UI inside the right-hand panel
                groupViewer.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h4 style="color: cyan; margin: 0; font-size: 18px;">${groupName}</h4>
                        <span style="color: #888; font-size: 12px;">Tap the tutor's name again to go back</span>
                    </div>
                    
                    <!-- Students Box -->
                    <div style="background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 15px;">
                        <h5 style="color: var(--green, #4CAF50); margin-top: 0; margin-bottom: 10px; font-size: 15px;">Enrolled Students</h5>
                        <div>${studentsHTML}</div>
                    </div>

                    <!-- Attendance Box -->
                    <div style="background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444;">
                        <h5 style="color: #b388ff; margin-top: 0; margin-bottom: 10px; font-size: 15px;">Attendance Records</h5>
                        <div>${attendanceHTML}</div>
                    </div>
                `;

            } catch (error) {
                console.error("Error fetching inside group data:", error);
                groupViewer.innerHTML = `<p style="color: red;">Error unlocking group data.</p>`;
            }
        }

        // FUNCTION 3: The placeholder for the next step
        function loadGroupDetails(groupId, groupName) {
            alert(`You clicked the group: ${groupName}\n\nNext, we will load the attendance and students!`);
        }
    </script>
</body>
</html>
