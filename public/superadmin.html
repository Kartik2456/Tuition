<body style="background: #111; color: white; font-family: sans-serif; padding: 20px;">

    <script>
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                const masterEmail = "ganeshthapa1420@gmail.com"; 
                
                if (user.email !== masterEmail) {
                    alert("ACCESS DENIED: Master Admin privileges required.");
                    window.location.href = "dashboard.html"; 
                } else {
                    // Unlock the page and trigger the Account Fetcher!
                    document.getElementById('vault-content').style.display = 'block';
                    document.getElementById('admin-email-display').innerText = user.email;
                    loadAllAccounts(); // This is the new magic command!
                }
            } else {
                window.location.href = "index.html"; 
            }
        });
    </script>

    <div id="vault-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="color: cyan; margin: 0; font-size: 22px;">Master Admin</h1>
            <button onclick="window.location.href='dashboard.html'" style="background: #333; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 5px; font-weight: bold;">Exit Vault</button>
        </div>
        <p style="margin-top: 5px; font-size: 13px;">Welcome, <span id="admin-email-display" style="color: yellow;"></span></p>
        <hr style="border-color: #333;">
        
        <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 15px;">
            
            <div style="background: #222; padding: 15px; border-radius: 8px;">
                <h3 style="color: cyan; margin-top: 0; margin-bottom: 10px;">Registered Tutors</h3>
                
                <!-- Notice there is NO 'overflow-x' or 'flex' here anymore! -->
                <div id="master-database-viewer">
                    <p style="color: #888;">Fetching all accounts...</p>
                </div>
            </div>

            <div style="background: #222; padding: 15px; border-radius: 8px; min-height: 50vh;">
                <h3 style="color: var(--green, #4CAF50); margin-top: 0;">Group Data</h3>
                <div id="group-viewer">
                    <p style="color: #888;">Tap a tutor above to view their groups and attendance records...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
       async function loadUserGroups(uid, userName) {
            const groupViewer = document.getElementById('group-viewer');
            groupViewer.innerHTML = `<p style="color: yellow;">Loading all groups for <b>${userName}</b>...</p>`;
            
            try {
                // This asks Firebase: "Find all groups where the 'owner' matches this exact user's UID"
                const snapshot = await db.collection('groups').where('owner', '==', uid).get();
                
                if (snapshot.empty) {
                    groupViewer.innerHTML = `
                        <h4 style="color: white; margin-top: 0;">Groups for ${userName}</h4>
                        <p style="color: #888;">This user hasn't created any groups yet.</p>
                    `;
                    return;
                }

                // Start building the list of groups
                let groupsHTML = `<h4 style="color: var(--green, #4CAF50); margin-top: 0; margin-bottom: 15px;">Groups for ${userName}</h4>`;
                
                // Loop through every group found and create a button for it
                snapshot.forEach(doc => {
                    const groupData = doc.data();
                    const groupName = groupData.name || "Unnamed Group";
                    const groupCode = groupData.code || "No Code";
                    const groupId = doc.id;

                    // Create a clickable card for each group
                    groupsHTML += `
                        <div style="background: #333; padding: 12px; margin-bottom: 10px; border-radius: 5px; cursor: pointer; border: 1px solid #444;"
                             onclick="loadGroupDetails('${groupId}', '${groupName}')">
                            <strong style="color: white; font-size: 16px;">📚 ${groupName}</strong><br>
                            <span style="color: #aaa; font-size: 13px;">Code: ${groupCode}</span>
                        </div>
                    `;
                });
                
                // Display the groups on the screen!
                groupViewer.innerHTML = groupsHTML;

            } catch (error) {
                console.error("Error fetching groups:", error);
                groupViewer.innerHTML = `<p style="color: red;">Error loading groups.</p>`;
            }
        }

        // The NEXT step for when you click a specific group!
        function loadGroupDetails(groupId, groupName) {
            alert(`You clicked the group: ${groupName}\n\nNext, we will load the attendance and students for this specific group!`);
        }
    </script>

</body>
