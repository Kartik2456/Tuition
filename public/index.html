<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid #bb86fc; position: sticky; top: 0; z-index: 100; }
        .nav-item { color: #bb86fc; text-decoration: none; font-weight: bold; cursor: pointer; padding: 5px 15px; border-radius: 5px; }
        .nav-item.active { background: #332940; color: white; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .section { display: none; } 
        .section.active { display: block; } 
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        
        /* Flex layout to put button beside table */
        .attendance-layout { display: flex; gap: 20px; align-items: flex-start; }
        .table-wrapper { flex: 3; }
        .submit-wrapper { flex: 1; position: sticky; top: 80px; }

        .sub-nav { margin-bottom: 20px; display: flex; gap: 10px; }
        .sub-btn { background: #333; color: #bb86fc; border: 1px solid #bb86fc; padding: 8px 20px; border-radius: 20px; cursor: pointer; }
        .sub-btn.active { background: #bb86fc; color: black; }
        
        input[type="text"], input[type="number"], input[type="date"] { background: #2c2c2c; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; margin: 5px; }
        
        /* BIGGER DOTS (Radio Buttons) */
        input[type="radio"] { transform: scale(1.8); cursor: pointer; accent-color: #bb86fc; }
        
        button { background: #bb86fc; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-submit { background: #03dac6; padding: 20px; font-size: 16px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #bb86fc; }
        .history-date { color: #bb86fc; cursor: pointer; text-decoration: underline; display: block; margin: 10px 0; font-size: 18px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-item active" id="nav-home" onclick="showSection('home')">Home</div>
        <div class="nav-item" id="nav-attendance" onclick="showSection('attendance')">Attendance</div>
        <div class="nav-item" id="nav-fees" onclick="showSection('fees')">Fees Status</div>
    </div>

    <div class="container">
        
        <div id="home" class="section active">
            <div class="card">
                <h3>Register New Student</h3>
                <input type="text" id="name" placeholder="Name">
                <input type="number" id="class" placeholder="Class (1-12)" min="1" max="12">
                <input type="date" id="date">
                <button onclick="addStudent()" style="width: auto;">Register</button>
            </div>
            <div class="card">
                <h3>Student List</h3>
                <table><thead><tr><th>Name</th><th>Class</th></tr></thead><tbody id="homeList"></tbody></table>
            </div>
        </div>

        <div id="attendance" class="section">
            <div class="sub-nav">
                <button class="sub-btn active" id="btn-today" onclick="showSubSection('today')">Today</button>
                <button class="sub-btn" id="btn-history" onclick="showSubSection('history')">History</button>
            </div>

            <div id="today" class="sub-section">
                <div class="attendance-layout">
                    <div class="card table-wrapper">
                        <h3>Today's Attendance</h3>
                        <table>
                            <thead><tr><th>Name</th><th>Present</th><th>Absent</th></tr></thead>
                            <tbody id="attendanceTodayList"></tbody>
                        </table>
                    </div>
                    <div class="submit-wrapper">
                        <button class="btn-submit" onclick="submitAttendance()">Final Submit<br>to History</button>
                    </div>
                </div>
            </div>

            <div id="history" class="sub-section" style="display:none;">
                <div class="card">
                    <h3>Attendance History</h3>
                    <div id="historyDates">No History Yet</div>
                    <div id="historyDetail" style="display:none;">
                        <button onclick="backToDates()" style="background:#444; color:white; margin-bottom:10px; width:auto;">← Back</button>
                        <h4 id="viewingDate"></h4>
                        <table id="historyDetailTable">
                            <thead><tr><th>Name</th><th>Status</th></tr></thead>
                            <tbody id="historyDetailBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="fees" class="section"><div class="card"><h3>Fees Status</h3><p>Management section coming soon.</p></div></div>
    </div>

    <script>
        let students = [];
        let attendanceData = {};

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-' + id).classList.add('active');
        }

        function showSubSection(subId) {
            document.getElementById('today').style.display = subId === 'today' ? 'block' : 'none';
            document.getElementById('history').style.display = subId === 'history' ? 'block' : 'none';
            document.getElementById('btn-today').classList.toggle('active', subId === 'today');
            document.getElementById('btn-history').classList.toggle('active', subId === 'history');
            if(subId === 'history') loadHistoryDates();
        }

        async function loadData() {
            const res = await fetch('/api/students');
            students = await res.json();
            document.getElementById('homeList').innerHTML = students.map(s => `<tr><td>${s.name}</td><td>${s.class}</td></tr>`).join('');
            document.getElementById('attendanceTodayList').innerHTML = students.map(s => `
                <tr>
                    <td>${s.name}</td>
                    <td><input type="radio" name="att-${s.name}" onclick="updateTempStatus('${s.name}', 'Present')"></td>
                    <td><input type="radio" name="att-${s.name}" onclick="updateTempStatus('${s.name}', 'Absent')"></td>
                </tr>
            `).join('');
        }

        function updateTempStatus(name, status) { attendanceData[name] = status; }

        async function submitAttendance() {
            const today = new Date().toLocaleDateString();
            const history = JSON.parse(localStorage.getItem('attHistory') || '[]');
            history.push({ date: today, records: attendanceData });
            localStorage.setItem('attHistory', JSON.stringify(history));
            alert("Attendance submitted for " + today);
            attendanceData = {};
            showSubSection('history');
        }

        function loadHistoryDates() {
            const history = JSON.parse(localStorage.getItem('attHistory') || '[]');
            const container = document.getElementById('historyDates');
            if(history.length === 0) { container.innerHTML = "No History Yet"; return; }
            document.getElementById('historyDetail').style.display = "none";
            container.style.display = "block";
            container.innerHTML = history.map((h, i) => `<div class="history-date" onclick="viewHistoryDetail(${i})">${h.date}</div>`).join('');
        }

        function viewHistoryDetail(i) {
            const history = JSON.parse(localStorage.getItem('attHistory'))[i];
            document.getElementById('historyDates').style.display = "none";
            document.getElementById('historyDetail').style.display = "block";
            document.getElementById('viewingDate').innerText = "Date: " + history.date;
            document.getElementById('historyDetailBody').innerHTML = Object.entries(history.records).map(([n, s]) => `<tr><td>${n}</td><td>${s}</td></tr>`).join('');
        }

        function backToDates() {
            document.getElementById('historyDetail').style.display = "none";
            document.getElementById('historyDates').style.display = "block";
        }

        async function addStudent() {
            const name = document.getElementById('name').value;
            const cls = document.getElementById('class').value;
            const dt = document.getElementById('date').value;
            await fetch('/api/students', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, class: cls, admissionDate: dt })
            });
            loadData();
        }
        loadData();
    </script>
</body>
</html>
