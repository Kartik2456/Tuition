<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid #bb86fc; position: sticky; top: 0; z-index: 100; }
        .nav-item { color: #bb86fc; text-decoration: none; font-weight: bold; cursor: pointer; padding: 5px 15px; border-radius: 5px; }
        .nav-item.active { background: #332940; color: white; }
        .container { max-width: 1100px; margin: 20px auto; padding: 20px; }
        .section { display: none; } 
        .section.active { display: block; } 
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        
        .layout-with-sidebar { display: flex; gap: 20px; align-items: flex-start; }
        .table-wrapper { flex: 3; }
        .side-wrapper { flex: 1; position: sticky; top: 80px; }

        .sub-nav { margin-bottom: 20px; display: flex; gap: 10px; }
        .sub-btn { background: #333; color: #bb86fc; border: 1px solid #bb86fc; padding: 8px 20px; border-radius: 20px; cursor: pointer; width: 50%; text-align: center; }
        .sub-btn.active { background: #bb86fc; color: black; }
        
        input { background: #2c2c2c; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; margin: 2px; }
        input[type="date"] { color-scheme: dark; }
        input[type="radio"] { transform: scale(1.6); cursor: pointer; accent-color: #bb86fc; margin-right: 10px; }
        
        button { background: #bb86fc; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-large { background: #03dac6; padding: 25px; font-size: 20px; width: 100%; border-radius: 12px; }
        .btn-small { padding: 5px 10px; font-size: 12px; background: #03dac6; margin-left: 5px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #bb86fc; }
        
        .date-input-area { display: none; align-items: center; margin-top: 5px; }
        .submitted-text { color: #03dac6; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-item active" id="nav-students" onclick="showSection('students')">Students</div>
        <div class="nav-item" id="nav-attendance" onclick="showSection('attendance')">Attendance</div>
        <div class="nav-item" id="nav-fees" onclick="showSection('fees')">Fees Status</div>
    </div>

    <div class="container">
        
        <!-- STUDENTS SECTION -->
        <div id="students" class="section active">
            <div class="card">
                <h3>Register New Student</h3>
                <input type="text" id="name" placeholder="Name">
                <input type="number" id="class" placeholder="Class (1-12)" min="1" max="12">
                <input type="date" id="date">
                <button onclick="addStudent()">Register</button>
            </div>
            <div class="card">
                <h3>Student List</h3>
                <table>
                    <thead><tr><th>Name</th><th>Class</th><th>Date of Admission</th></tr></thead>
                    <tbody id="homeList"></tbody>
                </table>
            </div>
        </div>

        <!-- ATTENDANCE SECTION -->
        <div id="attendance" class="section">
            <div class="sub-nav">
                <div class="sub-btn active" id="btn-today" onclick="showSubSection('today')">Today</div>
                <div class="sub-btn" id="btn-history" onclick="showSubSection('history')">History</div>
            </div>
            <div id="today" class="sub-section">
                <div class="layout-with-sidebar">
                    <div class="card table-wrapper">
                        <h3>Today's Attendance</h3>
                        <table>
                            <thead><tr><th>Name</th><th>Present</th><th>Absent</th></tr></thead>
                            <tbody id="attendanceTodayList"></tbody>
                        </table>
                    </div>
                    <div class="side-wrapper"><button class="btn-large" onclick="submitAttendance()">Submit</button></div>
                </div>
            </div>
            <div id="history" class="sub-section" style="display:none;">
                <div class="card"><div id="historyDates">No History Yet</div></div>
            </div>
        </div>

        <!-- FEES SECTION -->
        <div id="fees" class="section">
            <div class="card">
                <h3>Fees Management</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status Selection</th>
                            <th>Payment Details</th>
                        </tr>
                    </thead>
                    <tbody id="feesStudentList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let students = [];

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-' + id).classList.add('active');
        }

        function showSubSection(subId) {
            document.getElementById('today').style.display = subId === 'today' ? 'block' : 'none';
            document.getElementById('history').style.display = subId === 'history' ? 'block' : 'none';
            document.getElementById('btn-today').classList.toggle('active', subId === 'today');
            document.getElementById('btn-history').classList.toggle('active', subId === 'history');
        }

        async function loadData() {
            const res = await fetch('/api/students');
            students = await res.json();
            
            document.getElementById('homeList').innerHTML = students.map(s => `
                <tr><td>${s.name}</td><td>${s.class}</td><td>${s.admissionDate || 'N/A'}</td></tr>
            `).join('');

            document.getElementById('attendanceTodayList').innerHTML = students.map(s => `
                <tr>
                    <td>${s.name}</td>
                    <td><input type="radio" name="att-${s.name}"></td>
                    <td><input type="radio" name="att-${s.name}"></td>
                </tr>
            `).join('');

            // FEES TAB LOGIC
            document.getElementById('feesStudentList').innerHTML = students.map((s, index) => `
                <tr>
                    <td>${s.name}</td>
                    <td>
                        <label><input type="radio" name="fee-${index}" onclick="handleFeeClick(${index}, 'Paid')"> Paid</label>
                        <label style="margin-left:15px;"><input type="radio" name="fee-${index}" onclick="handleFeeClick(${index}, 'Pending')"> Pending</label>
                    </td>
                    <td id="fee-action-${index}">
                        <div id="date-box-${index}" class="date-input-area">
                            <input type="date" id="input-date-${index}">
                            <button class="btn-small" onclick="lockFeeDate(${index})">Submit Date</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function handleFeeClick(index, status) {
            const dateBox = document.getElementById(`date-box-${index}`);
            if (status === 'Paid') {
                dateBox.style.display = 'flex';
            } else {
                dateBox.style.display = 'none';
            }
        }

        function lockFeeDate(index) {
            const dateInput = document.getElementById(`input-date-${index}`).value;
            if (!dateInput) return alert("Please select a date first");
            
            const displayArea = document.getElementById(`fee-action-${index}`);
            // Format date to DD-MM-YYYY
            const d = new Date(dateInput);
            const formattedDate = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
            
            displayArea.innerHTML = `<span class="submitted-text">Submitted on ${formattedDate}</span>`;
            
            // Disable the radio buttons for this student to lock status
            const radios = document.getElementsByName(`fee-${index}`);
            radios.forEach(r => r.disabled = true);
        }

        async function addStudent() {
            const name = document.getElementById('name').value;
            const cls = document.getElementById('class').value;
            const dt = document.getElementById('date').value;
            await fetch('/api/students', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, class: cls, admissionDate: dt })
            });
            loadData();
        }
        loadData();
    </script>
</body>
</html>
