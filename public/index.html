<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid #bb86fc; position: sticky; top: 0; z-index: 100; }
        .nav-item { color: #bb86fc; text-decoration: none; font-weight: bold; cursor: pointer; padding: 5px 15px; border-radius: 5px; }
        .nav-item.active { background: #332940; color: white; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        .section { display: none; } 
        .section.active { display: block; } 
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        
        input { background: #2c2c2c; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; }
        input[type="date"] { color-scheme: dark; }
        input[type="radio"] { transform: scale(1.6); cursor: pointer; accent-color: #bb86fc; margin-right: 8px; }
        
        button { background: #bb86fc; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-submit-date { background: #03dac6; padding: 8px 15px; font-size: 14px; margin-left: 10px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #bb86fc; }
        
        /* Container for the toggling UI */
        .fees-action-container { min-height: 45px; display: flex; align-items: center; }
        .submitted-msg { color: #03dac6; font-weight: bold; border: 1px solid #03dac6; padding: 8px 15px; border-radius: 8px; background: rgba(3, 218, 198, 0.1); }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-item active" id="nav-students" onclick="showSection('students')">Students</div>
        <div class="nav-item" id="nav-attendance" onclick="showSection('attendance')">Attendance</div>
        <div class="nav-item" id="nav-fees" onclick="showSection('fees')">Fees Status</div>
    </div>

    <div class="container">
        
        <!-- STUDENTS SECTION -->
        <div id="students" class="section active">
            <div class="card">
                <h3>Register New Student</h3>
                <input type="text" id="name" placeholder="Name">
                <input type="number" id="class" placeholder="Class (1-12)" min="1" max="12">
                <input type="date" id="date">
                <button onclick="addStudent()">Register</button>
            </div>
            <div class="card">
                <h3>Student List</h3>
                <table>
                    <thead><tr><th>Name</th><th>Class</th><th>Date of Admission</th></tr></thead>
                    <tbody id="homeList"></tbody>
                </table>
            </div>
        </div>

        <!-- ATTENDANCE SECTION (Simplified logic) -->
        <div id="attendance" class="section">
            <div class="card">
                <h3>Today's Attendance</h3>
                <table id="attendanceTable">
                    <thead><tr><th>Name</th><th>Present</th><th>Absent</th></tr></thead>
                    <tbody id="attendanceTodayList"></tbody>
                </table>
            </div>
        </div>

        <!-- FEES SECTION -->
        <div id="fees" class="section">
            <div class="card">
                <h3>Fees Management</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Status / Action</th>
                        </tr>
                    </thead>
                    <tbody id="feesStudentList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let students = [];

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-' + id).classList.add('active');
        }

        async function loadData() {
            const res = await fetch('/api/students');
            students = await res.json();
            
            // Update Students Tab
            document.getElementById('homeList').innerHTML = students.map(s => `
                <tr><td>${s.name}</td><td>${s.class}</td><td>${s.admissionDate || 'N/A'}</td></tr>
            `).join('');

            // Update Attendance Tab
            document.getElementById('attendanceTodayList').innerHTML = students.map(s => `
                <tr>
                    <td>${s.name}</td>
                    <td><input type="radio" name="att-${s.name}"></td>
                    <td><input type="radio" name="att-${s.name}"></td>
                </tr>
            `).join('');

            // Update Fees Tab with Toggling UI
            document.getElementById('feesStudentList').innerHTML = students.map((s, i) => `
                <tr>
                    <td>${s.name}</td>
                    <td>
                        <div id="fee-container-${i}" class="fees-action-container">
                            <label><input type="radio" name="fee-opt-${i}" onclick="showDatePicker(${i})"> Paid</label>
                            <label style="margin-left:20px;"><input type="radio" name="fee-opt-${i}" onclick="hideDatePicker(${i})"> Pending</label>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function showDatePicker(index) {
            const container = document.getElementById(`fee-container-${index}`);
            container.innerHTML = `
                <input type="date" id="date-input-${index}">
                <button class="btn-submit-date" onclick="finalizeFee(${index})">Submit</button>
                <button style="background:transparent; color:#cf6679; margin-left:10px;" onclick="resetFeeRow(${index})">Cancel</button>
            `;
        }

        function hideDatePicker(index) {
            // Keep it as "Pending" selection
        }

        function resetFeeRow(index) {
            const container = document.getElementById(`fee-container-${index}`);
            const studentName = students[index].name;
            container.innerHTML = `
                <label><input type="radio" name="fee-opt-${index}" onclick="showDatePicker(${index})"> Paid</label>
                <label style="margin-left:20px;"><input type="radio" name="fee-opt-${index}" onclick="hideDatePicker(${index})"> Pending</label>
            `;
        }

        function finalizeFee(index) {
            const dateVal = document.getElementById(`date-input-${index}`).value;
            if (!dateVal) return alert("Select a date!");

            const d = new Date(dateVal);
            const formattedDate = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
            
            const container = document.getElementById(`fee-container-${index}`);
            container.innerHTML = `<span class="submitted-msg">Submitted on ${formattedDate}</span>`;
        }

        async function addStudent() {
            const name = document.getElementById('name').value;
            const cls = document.getElementById('class').value;
            const dt = document.getElementById('date').value;
            await fetch('/api/students', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, class: cls, admissionDate: dt })
            });
            loadData();
        }

        loadData();
    </script>
</body>
</html>
