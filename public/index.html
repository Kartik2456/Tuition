<script type="module">
  // These imports come directly from your SDK image
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Data copied exactly from image_9109f7.png
  const firebaseConfig = {
    apiKey: "AIzaSyDH9vfqKh16tka_14deuwWzYDQR-2TvR_U",
    authDomain: "tuituionhub.firebaseapp.com",
    projectId: "tuituionhub",
    storageBucket: "tuituionhub.firebasestorage.app",
    messagingSenderId: "373410141090",
    appId: "1:373410141090:web:45144c02501738c31798fb",
    measurementId: "G-XPS2L1NZ2V"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // The Login Button Logic
  document.getElementById('login-btn').onclick = () => {
    signInWithPopup(auth, provider)
      .then((result) => {
        // Once logged in, go to your dashboard file
        window.location.href = "dashboard.html";
      })
      .catch((error) => {
        alert("Login failed: " + error.message);
      });
  };

  // Check if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "dashboard.html";
    }
  });
</script>
