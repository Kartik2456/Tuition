<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f1b24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e1e1e; padding: 40px; border-radius: 15px; border: 1px solid #bb86fc; text-align: center; }
        button { background: white; color: black; border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Tuition Hub</h1>
        <p>Sign in to manage your students.</p>
        <!-- This ID must match the one in the script -->
        <button id="login-btn">Sign in with Google</button>
    </div>

    <script type="module">
        // Data copied exactly from image_9109f7.png
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDH9vfqKh16tka_14deuwWzYDQR-2TvR_U",
            authDomain: "tuituionhub.firebaseapp.com",
            projectId: "tuituionhub",
            storageBucket: "tuituionhub.firebasestorage.app",
            messagingSenderId: "373410141090",
            appId: "1:373410141090:web:45144c02501738c31798fb",
            measurementId: "G-XPS2L1NZ2V"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('login-btn').onclick = () => {
            signInWithPopup(auth, provider)
                .then(() => { window.location.href = "dashboard.html"; })
                .catch(err => alert("Error: " + err.message));
        };

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = "dashboard.html";
        });
    </script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered"))
                .catch(err => console.error("Service Worker Failed", err));
        }
    </script>
</body>
</html>
