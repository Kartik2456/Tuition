<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    
    <!-- Firebase SDKs for Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>

    <style>
        /* Existing Styles */
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid #bb86fc; position: sticky; top: 0; z-index: 100; }
        .nav-item { color: #bb86fc; text-decoration: none; font-weight: bold; cursor: pointer; padding: 5px 15px; border-radius: 5px; }
        .nav-item.active { background: #332940; color: white; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .section { display: none; } 
        .section.active { display: block; } 
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        
        /* Attendance & Fees Layout */
        .layout-with-sidebar { display: flex; gap: 20px; align-items: flex-start; }
        .table-wrapper { flex: 3; }
        .side-wrapper { flex: 1; position: sticky; top: 80px; }
        .sub-nav { margin-bottom: 20px; display: flex; gap: 10px; }
        .sub-btn { background: #333; color: #bb86fc; border: 1px solid #bb86fc; padding: 8px 20px; border-radius: 20px; cursor: pointer; width: 50%; text-align: center; }
        .sub-btn.active { background: #bb86fc; color: black; }
        
        /* Inputs & Buttons */
        input { background: #2c2c2c; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; }
        input[type="date"] { color-scheme: dark; }
        input[type="radio"] { transform: scale(1.8); cursor: pointer; accent-color: #bb86fc; margin-right: 8px; }
        button { background: #bb86fc; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-large { background: #03dac6; padding: 25px; font-size: 20px; width: 100%; border-radius: 12px; }
        
        /* New Login Styles */
        .hidden { display: none; }
        .auth-card { text-align: center; margin-top: 100px; }
        .submitted-msg { color: #03dac6; font-weight: bold; padding: 8px; border: 1px solid #03dac6; border-radius: 8px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #bb86fc; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="auth-card">
        <div class="card" style="display: inline-block;">
            <h1>Tuition Hub</h1>
            <button onclick="loginWithGoogle()" style="background: white; color: black; padding: 15px 30px;">Sign in with Google</button>
        </div>
    </div>

    <!-- 2. SETUP SCREEN (FOR NEW USERS) -->
    <div id="setup-screen" class="auth-card hidden">
        <div class="card" style="display: inline-block;">
            <h2>Finish Registration</h2>
            <button onclick="createTuition()">Create Tuition Registration</button>
            <p>OR</p>
            <input type="text" id="join-code" placeholder="Enter Unique Code">
            <button onclick="joinTuition()">Join Tuition</button>
        </div>
    </div>

    <!-- 3. MAIN DASHBOARD (OLD STUFF IS HERE) -->
    <div id="dashboard" class="hidden">
        <div class="navbar">
            <div class="nav-item active" id="nav-students" onclick="showSection('students')">Students</div>
            <div class="nav-item" id="nav-attendance" onclick="showSection('attendance')">Attendance</div>
            <div class="nav-item" id="nav-fees" onclick="showSection('fees')">Fees Status</div>
            <button onclick="logout()" style="background: transparent; color: #cf6679; border: 1px solid #cf6679; padding: 5px 10px;">Logout</button>
        </div>

        <div class="container">
            <!-- STUDENTS SECTION -->
            <div id="students" class="section active">
                <div class="card">
                    <h3>Register New Student</h3>
                    <input type="text" id="s-name" placeholder="Name">
                    <input type="number" id="s-class" placeholder="Class (1-12)" min="1" max="12">
                    <input type="date" id="s-date">
                    <button onclick="addStudent()">Register</button>
                </div>
                <div class="card">
                    <h3>Student List</h3>
                    <table><thead><tr><th>Name</th><th>Class</th><th>Adm. Date</th></tr></thead><tbody id="student-list-body"></tbody></table>
                </div>
            </div>

            <!-- ATTENDANCE SECTION -->
            <div id="attendance" class="section">
                <div class="sub-nav">
                    <div class="sub-btn active" id="btn-today" onclick="showSub('today')">Today</div>
                    <div class="sub-btn" id="btn-hist" onclick="showSub('hist')">History</div>
                </div>
                <div id="today" class="sub-section">
                    <div class="layout-with-sidebar">
                        <div class="card table-wrapper">
                            <table><thead><tr><th>Name</th><th>Present</th><th>Absent</th></tr></thead><tbody id="att-today-body"></tbody></table>
                        </div>
                        <div class="side-wrapper"><button class="btn-large" onclick="submitAttendance()">Submit</button></div>
                    </div>
                </div>
                <div id="hist" class="sub-section hidden"><div class="card" id="history-dates">No History Yet</div></div>
            </div>

            <!-- FEES SECTION -->
            <div id="fees" class="section">
                <div class="card">
                    <h3>Fees Management</h3>
                    <table><thead><tr><th>Student Name</th><th>Status / Action</th></tr></thead><tbody id="fees-list-body"></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ADD YOUR FIREBASE CONFIG HERE
        const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 1. Auth & View Switching
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                checkUserStatus(user);
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });

        function loginWithGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut(); }

        async function checkUserStatus(user) {
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists) {
                document.getElementById('dashboard').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('setup-screen').classList.remove('hidden');
            }
        }

        // 2. Setup Logic (Unique Code)
        function createTuition() {
            const code = 'TUIT-' + Math.random().toString(36).substr(2, 5).toUpperCase();
            db.collection('users').doc(auth.currentUser.uid).set({ role: 'teacher', tuitionCode: code }).then(() => location.reload());
        }

        // 3. Your Original Dashboard Functions (Restored)
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-' + id).classList.add('active');
        }

        function showSub(id) {
            document.getElementById('today').classList.toggle('hidden', id !== 'today');
            document.getElementById('hist').classList.toggle('hidden', id !== 'hist');
            document.getElementById('btn-today').classList.toggle('active', id === 'today');
            document.getElementById('btn-hist').classList.toggle('active', id === 'hist');
        }

        async function loadData() {
            // Load students from DB and populate your lists as we did before
            // Replace console.log with your previous list-building code
            console.log("Loading user data from Firestore...");
        }

        function finalizeFee(index, name) {
            const dateVal = document.getElementById(`date-input-${index}`).value;
            if (!dateVal) return alert("Select a date!");
            const d = new Date(dateVal);
            const formatted = `${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}`;
            document.getElementById(`fee-row-${index}`).innerHTML = `<span class="submitted-msg">Submitted on ${formatted}</span>`;
        }
    </script>
</body>
</html>
