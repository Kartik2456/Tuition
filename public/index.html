<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 70px; }
        
        /* Top Navigation */
        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid #bb86fc; position: sticky; top: 0; z-index: 100; }
        .nav-item { color: #bb86fc; font-weight: bold; cursor: pointer; padding: 5px 15px; border-radius: 5px; }
        .nav-item.active { background: #332940; color: white; }

        /* Bottom Navigation */
        .bottom-nav { background: #1f1b24; display: flex; justify-content: space-around; padding: 12px; border-top: 2px solid #bb86fc; position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .bottom-item { color: #bb86fc; font-weight: bold; cursor: pointer; text-align: center; flex: 1; }
        .bottom-item.active { color: white; }

        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .section { display: none; } 
        .section.active { display: block; } 
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        
        /* Profile Styling */
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #bb86fc; object-fit: cover; margin-bottom: 15px; }
        .settings-btn { display: block; width: 100%; background: #333; color: white; padding: 15px; margin: 10px 0; border-radius: 8px; text-align: left; border: 1px solid #444; }
        .logout-btn { color: #cf6679; border-color: #cf6679; }

        input { background: #2c2c2c; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; margin: 5px; }
        button { background: #bb86fc; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #bb86fc; }
    </style>
</head>
<body>

    <!-- MAIN VIEW (Home) -->
    <div id="view-home" class="view">
        <div class="navbar">
            <div class="nav-item active" id="nav-students" onclick="showSection('students')">Students</div>
            <div class="nav-item" id="nav-attendance" onclick="showSection('attendance')">Attendance</div>
            <div class="nav-item" id="nav-fees" onclick="showSection('fees')">Fees Status</div>
        </div>
        <div class="container">
            <div id="students" class="section active">
                <div class="card">
                    <h3>Register New Student</h3>
                    <input type="text" id="s-name" placeholder="Name">
                    <input type="number" id="s-class" placeholder="Class (1-12)" min="1" max="12">
                    <input type="date" id="s-date">
                    <button onclick="addStudent()">Register</button>
                </div>
                <div class="card">
                    <h3>Student List</h3>
                    <table><thead><tr><th>Name</th><th>Class</th><th>Adm. Date</th></tr></thead><tbody id="student-list-body"></tbody></table>
                </div>
            </div>
            <!-- Attendance and Fees sections go here as before -->
        </div>
    </div>

    <!-- PROFILE VIEW -->
    <div id="view-profile" class="view" style="display: none;">
        <div class="container">
            <div class="card" style="text-align: center;">
                <img src="https://via.placeholder.com/100" id="user-photo" class="profile-img">
                <br>
                <input type="file" id="photo-upload" style="display: none;" onchange="uploadPhoto(event)">
                <button onclick="document.getElementById('photo-upload').click()">Set Profile Photo</button>
                <h2 id="display-name">User Name</h2>
                <p id="display-email">email@example.com</p>
            </div>

            <div class="card">
                <h3>Management & Settings</h3>
                <button class="settings-btn" onclick="removeAllStudents()">🗑️ Remove All Students</button>
                <button class="settings-btn">🌙 Dark Mode (Always On)</button>
                <button class="settings-btn">🔔 Notification Settings</button>
                <button class="settings-btn logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="bottom-item active" id="bot-home" onclick="switchView('home')">🏠<br>Home</div>
        <div class="bottom-item" id="bot-profile" onclick="switchView('profile')">👤<br>Profile</div>
    </div>

    <script>
        // Use your Firebase Config here
        const firebaseConfig = { /* YOUR CONFIG */ };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function switchView(view) {
            document.getElementById('view-home').style.display = view === 'home' ? 'block' : 'none';
            document.getElementById('view-profile').style.display = view === 'profile' ? 'block' : 'none';
            
            document.getElementById('bot-home').classList.toggle('active', view === 'home');
            document.getElementById('bot-profile').classList.toggle('active', view === 'profile');
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-' + id).classList.add('active');
        }

        function uploadPhoto(event) {
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById('user-photo').src = reader.result;
                localStorage.setItem('profilePhoto', reader.result);
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function removeAllStudents() {
            if(confirm("Are you sure you want to delete all student records? This cannot be undone.")) {
                // Logic to clear Firestore collection
                alert("All students removed.");
            }
        }

        function logout() { auth.signOut(); }

        // On Load
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('display-name').innerText = user.displayName || "Teacher";
                document.getElementById('display-email').innerText = user.email;
                if(localStorage.getItem('profilePhoto')) {
                    document.getElementById('user-photo').src = localStorage.getItem('profilePhoto');
                }
            }
        });
    </script>
</body>
</html>
