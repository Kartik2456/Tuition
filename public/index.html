<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid #bb86fc; position: sticky; top: 0; z-index: 100; }
        .nav-item { color: #bb86fc; text-decoration: none; font-weight: bold; cursor: pointer; padding: 5px 15px; border-radius: 5px; }
        .nav-item.active { background: #332940; color: white; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        .section { display: none; } 
        .section.active { display: block; } 
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        .sub-nav { margin-bottom: 20px; display: flex; gap: 10px; }
        .sub-btn { background: #333; color: #bb86fc; border: 1px solid #bb86fc; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
        .sub-btn.active { background: #bb86fc; color: black; }
        input { background: #2c2c2c; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; margin: 5px; width: 180px; }
        input[type="date"] { color-scheme: dark; }
        button { background: #bb86fc; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #bb86fc; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-item active" id="nav-home" onclick="showSection('home')">Home</div>
        <div class="nav-item" id="nav-attendance" onclick="showSection('attendance')">Attendance</div>
        <div class="nav-item" id="nav-fees" onclick="showSection('fees')">Fees Status</div>
    </div>

    <div class="container">
        
        <!-- HOME SECTION -->
        <div id="home" class="section active">
            <div class="card">
                <h3>Register New Student</h3>
                <input type="text" id="name" placeholder="Name">
                <input type="number" id="class" placeholder="Class (1-12)" min="1" max="12">
                <input type="date" id="date">
                <button onclick="addStudent()">Register</button>
            </div>
            <div class="card">
                <h3>Student List</h3>
                <table>
                    <thead><tr><th>Name</th><th>Class</th><th>Adm. Date</th></tr></thead>
                    <tbody id="homeList"></tbody>
                </table>
            </div>
        </div>

        <!-- ATTENDANCE SECTION -->
        <div id="attendance" class="section">
            <div class="sub-nav">
                <button class="sub-btn active" id="btn-today" onclick="showSubSection('today')">Today</button>
                <button class="sub-btn" id="btn-history" onclick="showSubSection('history')">History</button>
            </div>

            <div id="today" class="sub-section">
                <div class="card">
                    <h3>Mark Today's Attendance</h3>
                    <table>
                        <thead><tr><th>Name</th><th>Class</th><th>Action</th></tr></thead>
                        <tbody id="attendanceTodayList"></tbody>
                    </table>
                </div>
            </div>

            <div id="history" class="sub-section" style="display:none;">
                <div class="card">
                    <h3>Attendance History</h3>
                    <input type="date" id="historyFilter" onchange="loadHistory()">
                    <table>
                        <thead><tr><th>Name</th><th>Class</th><th>Date</th></tr></thead>
                        <tbody id="historyList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- FEES SECTION -->
        <div id="fees" class="section">
            <div class="card"><h3>Fees Management</h3><tbody id="feesList"></tbody></div>
        </div>
    </div>

    <script>
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-' + id).classList.add('active');
        }

        function showSubSection(subId) {
            document.getElementById('today').style.display = subId === 'today' ? 'block' : 'none';
            document.getElementById('history').style.display = subId === 'history' ? 'block' : 'none';
            document.getElementById('btn-today').classList.toggle('active', subId === 'today');
            document.getElementById('btn-history').classList.toggle('active', subId === 'history');
        }

        async function loadData() {
            const res = await fetch('/api/students');
            const students = await res.json();
            
            document.getElementById('homeList').innerHTML = students.map(s => `
                <tr><td>${s.name}</td><td>${s.class}</td><td>${s.admissionDate || 'N/A'}</td></tr>
            `).join('');

            document.getElementById('attendanceTodayList').innerHTML = students.map(s => `
                <tr>
                    <td>${s.name}</td>
                    <td>${s.class}</td>
                    <td><button style="background:#03dac6; padding:5px 10px;" onclick="markPresent('${s.name}', '${s.class}')">Mark Present</button></td>
                </tr>
            `).join('');
        }

        // Logic for marking presence and filtering history would go here
        function markPresent(name, cls) { alert("Present marked for " + name); }
        function loadHistory() { /* Future logic for fetching dated records */ }

        async function addStudent() {
            const name = document.getElementById('name').value;
            const cls = document.getElementById('class').value;
            const dt = document.getElementById('date').value;
            if(!name || !cls || !dt) return alert("Fill all fields!");
            await fetch('/api/students', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, class: cls, admissionDate: dt })
            });
            loadData();
        }
        loadData();
    </script>
</body>
</html>
