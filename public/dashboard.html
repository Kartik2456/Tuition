<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #bb86fc; --green: #03dac6; --red: #cf6679; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; overflow-x: hidden; }
        
        .hidden { display: none !important; }
        .section { display: none; }
        .section.active { display: block; }

        /* Top Navigation */
        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .nav-item { color: var(--accent); font-weight: bold; cursor: pointer; padding: 8px 20px; border-radius: 8px; }
        .nav-item.active { background: #332940; color: white; box-shadow: 0 0 10px var(--accent); }

        /* Sub-navigation for Attendance Branches */
        .sub-nav { display: flex; gap: 15px; margin-bottom: 20px; }
        .sub-item { color: var(--accent); cursor: pointer; font-size: 14px; padding: 5px 12px; border: 1px solid var(--accent); border-radius: 20px; }
        .sub-item.active { background: var(--accent); color: #000; }

        /* Bottom Navigation */
        .bottom-nav { background: #1f1b24; display: flex; justify-content: space-around; padding: 12px; border-top: 2px solid var(--accent); position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .bottom-item { color: var(--accent); font-weight: bold; cursor: pointer; text-align: center; flex: 1; opacity: 0.6; }
        .bottom-item.active { color: white; opacity: 1; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        
        input, button { background: #2c2c2c; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; margin: 5px; }
        input[type="radio"] { transform: scale(1.8); cursor: pointer; accent-color: var(--accent); margin-right: 5px; vertical-align: middle; }
        label { cursor: pointer; }
        
        button { background: var(--accent); color: #000; border: none; font-weight: bold; cursor: pointer; }
        .btn-submit-date { background: var(--green); color: #000; padding: 8px 15px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--accent); font-size: 13px; text-transform: uppercase; }
        .fees-done { color: var(--green); font-weight: bold; font-style: italic; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent); }
    </style>
</head>
<body>

    <!-- AUTH GATE -->
    <div id="view-auth" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="card" style="text-align: center; width: 320px;">
            <h1 style="color: var(--accent);">Tuition Hub</h1>
            <button onclick="handleLogin()" style="background: white; color: black; width: 100%; padding: 15px;">Sign in with Google</button>
        </div>
    </div>

    <!-- MAIN UI -->
    <div id="main-ui" class="hidden">
        <div id="view-home">
            <div class="navbar">
                <div class="nav-item active" id="tab-students" onclick="showSection('students')">Students</div>
                <div class="nav-item" id="tab-attendance" onclick="showSection('attendance')">Attendance</div>
                <div class="nav-item" id="tab-fees" onclick="showSection('fees')">Fees Status</div>
            </div>

            <div class="container">
                <!-- STUDENTS SECTION -->
                <div id="section-students" class="section active">
                    <div class="card">
                        <h3>Register Student</h3>
                        <input type="text" id="s-name" placeholder="Name">
                        <input type="number" id="s-class" placeholder="Class">
                        <input type="date" id="s-date">
                        <button onclick="addStudent()">Register</button>
                    </div>
                    <div class="card">
                        <h3>Student History</h3>
                        <table><thead><tr><th>Name</th><th>Class</th><th>Adm. Date</th></tr></thead><tbody id="homeList"></tbody></table>
                    </div>
                </div>

                <!-- ATTENDANCE SECTION (With Today and History Branches) -->
                <div id="section-attendance" class="section">
                    <div class="sub-nav">
                        <div class="sub-item active" id="sub-today" onclick="switchAttBranch('today')">Today (<span id="currentDateDisplay"></span>)</div>
                        <div class="sub-item" id="sub-history" onclick="switchAttBranch('history')">History</div>
                    </div>

                    <!-- Today Branch -->
                    <div id="branch-today" class="att-branch">
                        <div class="card" style="display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;">
                            <div style="flex: 3; min-width: 300px;">
                                <table><thead><tr><th>Name</th><th style="text-align:center;">P</th><th style="text-align:center;">A</th></tr></thead><tbody id="attList"></tbody></table>
                            </div>
                            <button style="flex: 1; background: var(--green); padding: 30px; font-size: 20px; border-radius: 12px; min-width: 200px;">Submit</button>
                        </div>
                    </div>

                    <!-- History Branch -->
                    <div id="branch-history" class="att-branch hidden">
                        <div class="card">
                            <h3>Attendance History</h3>
                            <p style="opacity: 0.6;">Past attendance logs will appear here.</p>
                        </div>
                    </div>
                </div>

                <!-- FEES SECTION -->
                <div id="section-fees" class="section">
                    <div class="card">
                        <h3>Monthly Fees Tracker</h3>
                        <table><thead><tr><th>Student Name</th><th>Status Selection</th></tr></thead><tbody id="feesList"></tbody></table>
                    </div>
                </div>
            </div>
        </div>

        <!-- PROFILE SECTION -->
        <div id="view-profile" class="hidden">
            <div class="container">
                <div class="card" style="text-align: center;">
                    <img id="userImg" class="profile-img">
                    <h2 id="userName"></h2>
                    <p id="userEmail" style="opacity: 0.6;"></p>
                </div>
                <div class="card">
                    <h3 style="color: var(--red);">Remove Students</h3>
                    <div id="removalList"></div>
                    <button onclick="handleLogout()" style="background: var(--red); color: white; width: 100%; margin-top: 20px;">Logout</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="bottom-item active" id="bot-home" onclick="switchView('home')">🏠<br>Home</div>
            <div class="bottom-item" id="bot-profile" onclick="switchView('profile')">👤<br>Profile</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDH9vfqKh16tka_14deuwWzYDQR-2TvR_U",
            authDomain: "tuituionhub.firebaseapp.com",
            projectId: "tuituionhub",
            storageBucket: "tuituionhub.firebasestorage.app",
            messagingSenderId: "373410141090",
            appId: "1:373410141090:web:45144c02501738c31798fb"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Sets current date on the "Today" branch
        document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
        }

        function switchAttBranch(branch) {
            document.getElementById('branch-today').classList.toggle('hidden', branch !== 'today');
            document.getElementById('branch-history').classList.toggle('hidden', branch !== 'history');
            document.getElementById('sub-today').classList.toggle('active', branch === 'today');
            document.getElementById('sub-history').classList.toggle('active', branch === 'history');
        }

        function switchView(view) {
            document.getElementById('view-home').classList.toggle('hidden', view !== 'home');
            document.getElementById('view-profile').classList.toggle('hidden', view !== 'profile');
            document.getElementById('bot-home').classList.toggle('active', view === 'home');
            document.getElementById('bot-profile').classList.toggle('active', view === 'profile');
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userEmail').innerText = user.email;
                if(user.photoURL) document.getElementById('userImg').src = user.photoURL;
                loadData();
            } else {
                document.getElementById('view-auth').classList.remove('hidden');
                document.getElementById('main-ui').classList.add('hidden');
            }
        });

        function handleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function handleLogout() { auth.signOut().then(() => window.location.href = "index.html"); }

        async function loadData() {
            const snapshot = await db.collection('students').orderBy('name').get();
            const home = document.getElementById('homeList');
            const att = document.getElementById('attList');
            const fees = document.getElementById('feesList');
            const rem = document.getElementById('removalList');

            home.innerHTML = ""; att.innerHTML = ""; fees.innerHTML = ""; rem.innerHTML = "";

            snapshot.forEach(doc => {
                const s = doc.data();
                const id = doc.id;
                
                home.innerHTML += `<tr><td>${s.name}</td><td>${s.class}</td><td>${s.admissionDate}</td></tr>`;
                att.innerHTML += `<tr><td>${s.name}</td><td style="text-align:center;"><input type="radio" name="at-${id}"></td><td style="text-align:center;"><input type="radio" name="at-${id}"></td></tr>`;
                
                fees.innerHTML += `
                    <tr>
                        <td>${s.name}</td>
                        <td id="fees-container-${id}">
                            <input type="radio" name="pay-${id}" id="p-${id}" onclick="toggleDateInput('${id}')">
                            <label for="p-${id}">Paid</label>
                            <input type="radio" name="pay-${id}" id="pn-${id}" checked>
                            <label for="pn-${id}">Pending</label>
                        </td>
                    </tr>`;
                
                rem.innerHTML += `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #333;"><span>${s.name}</span><button onclick="deleteStudent('${id}')" style="background:var(--red); padding:5px 12px; font-size:12px;">Delete</button></div>`;
            });
        }

        function toggleDateInput(id) {
            const container = document.getElementById('fees-container-' + id);
            container.innerHTML = `
                <input type="date" id="date-${id}" style="color-scheme:dark; margin-right:10px;">
                <button class="btn-submit-date" onclick="submitFees('${id}')">Submit Date</button>
            `;
        }

        function submitFees(id) {
            const dateVal = document.getElementById('date-' + id).value;
            if (!dateVal) return alert("Select payment date!");
            const container = document.getElementById('fees-container-' + id);
            const formattedDate = dateVal.split('-').reverse().join('-');
            container.innerHTML = `<span class="fees-done">Fees is submitted on ${formattedDate}</span>`;
        }

        async function addStudent() {
            const name = document.getElementById('s-name').value;
            const cls = document.getElementById('s-class').value;
            const date = document.getElementById('s-date').value;
            if(!name || !cls || !date) return alert("Fill details!");
            await db.collection('students').add({ name, class: cls, admissionDate: date });
            loadData();
        }

        async function deleteStudent(id) {
            if(confirm("Delete student?")) {
                await db.collection('students').doc(id).delete();
                loadData();
            }
        }
    </script>
</body>
</html>
