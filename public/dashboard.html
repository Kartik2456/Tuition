<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #bb86fc; --green: #03dac6; --red: #cf6679; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; }
        .hidden { display: none !important; }

        /* Top Navigation */
        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .nav-item { color: var(--accent); font-weight: bold; cursor: pointer; padding: 5px 15px; border-radius: 5px; }
        .nav-item.active { background: #332940; color: white; }

        /* Bottom Navigation */
        .bottom-nav { background: #1f1b24; display: flex; justify-content: space-around; padding: 12px; border-top: 2px solid var(--accent); position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .bottom-item { color: var(--accent); font-weight: bold; cursor: pointer; text-align: center; flex: 1; }
        .bottom-item.active { color: white; }

        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        
        /* Sidebar Layout for Attendance */
        .layout-with-sidebar { display: flex; gap: 20px; align-items: flex-start; }
        .table-wrapper { flex: 3; }
        .side-wrapper { flex: 1; position: sticky; top: 80px; }

        input, button { background: #2c2c2c; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; margin: 5px; }
        input[type="date"] { color-scheme: dark; }
        input[type="radio"] { transform: scale(1.8); cursor: pointer; accent-color: var(--accent); margin-right: 8px; }
        
        button { background: var(--accent); color: #000; border: none; font-weight: bold; cursor: pointer; }
        .btn-large { background: var(--green); padding: 25px; font-size: 20px; width: 100%; border-radius: 12px; }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--accent); }
        .submitted-msg { color: var(--green); font-weight: bold; border: 1px solid var(--green); padding: 8px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN GATE (The fix for the unresponsive box) -->
    <div id="view-auth" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="card" style="text-align: center; width: 350px;">
            <h1 style="color: var(--accent);">Tuition Hub</h1>
            <p>Verification Required</p>
            <button onclick="handleLogin()" style="background: white; color: black; padding: 15px 30px; width: 100%;">Sign in with Google</button>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD (The older design you liked) -->
    <div id="main-ui" class="hidden">
        <div id="view-home">
            <div class="navbar">
                <div class="nav-item active" id="tab-students" onclick="showSection('students')">Students</div>
                <div class="nav-item" id="tab-attendance" onclick="showSection('attendance')">Attendance</div>
                <div class="nav-item" id="tab-fees" onclick="showSection('fees')">Fees Status</div>
            </div>

            <div class="container">
                <!-- STUDENTS SECTION -->
                <div id="section-students" class="section active">
                    <div class="card">
                        <h3>Register New Student</h3>
                        <input type="text" id="s-name" placeholder="Name">
                        <input type="number" id="s-class" placeholder="Class (1-12)" min="1" max="12">
                        <input type="date" id="s-date">
                        <button onclick="addStudent()">Register</button>
                    </div>
                    <div class="card">
                        <h3>Student List</h3>
                        <table><thead><tr><th>Name</th><th>Class</th><th>Adm. Date</th></tr></thead><tbody id="homeList"></tbody></table>
                    </div>
                </div>

                <!-- ATTENDANCE SECTION -->
                <div id="section-attendance" class="section">
                    <div class="layout-with-sidebar">
                        <div class="card table-wrapper">
                            <h3>Today's Attendance</h3>
                            <table><thead><tr><th>Name</th><th>P</th><th>A</th></tr></thead><tbody id="attList"></tbody></table>
                        </div>
                        <div class="side-wrapper"><button class="btn-large" onclick="alert('Submitted!')">Submit</button></div>
                    </div>
                </div>

                <!-- FEES SECTION -->
                <div id="section-fees" class="section">
                    <div class="card">
                        <h3>Fees Management</h3>
                        <table><thead><tr><th>Name</th><th>Action</th></tr></thead><tbody id="feesList"></tbody></table>
                    </div>
                </div>
            </div>
        </div>

        <!-- PROFILE VIEW -->
        <div id="view-profile" class="hidden">
            <div class="container">
                <div class="card" style="text-align: center;">
                    <img id="userImg" class="profile-img" src="https://via.placeholder.com/90">
                    <h2 id="userName" style="margin: 10px 0 5px 0;">Kartik</h2>
                    <p id="userEmail" style="opacity: 0.7;">loading...</p>
                    <button onclick="document.getElementById('fileIn').click()">Change Photo</button>
                    <input type="file" id="fileIn" class="hidden" onchange="uploadPhoto(event)">
                </div>
                <div class="card">
                    <h3>Remove Students</h3>
                    <div id="removalList"></div>
                    <hr style="border: 1px solid #333; margin: 20px 0;">
                    <button onclick="handleLogout()" style="background: var(--red); color: white; width: 100%;">🚪 Logout Account</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="bottom-item active" id="bot-home" onclick="switchView('home')">🏠<br>Home</div>
            <div class="bottom-item" id="bot-profile" onclick="switchView('profile')">👤<br>Profile</div>
        </div>
    </div>

    <script>
        // Use your real config from image_9b0643.png
        const firebaseConfig = {
            apiKey: "AIzaSyDH9vfqKh16tka_14deuwWzYDQR-2TvR_U",
            authDomain: "tuituionhub.firebaseapp.com",
            projectId: "tuituionhub",
            storageBucket: "tuituionhub.firebasestorage.app",
            messagingSenderId: "373410141090",
            appId: "1:373410141090:web:45144c02501738c31798fb"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 1. Navigation Logic
        function switchView(v) {
            document.getElementById('view-home').classList.toggle('hidden', v !== 'home');
            document.getElementById('view-profile').classList.toggle('hidden', v !== 'profile');
            document.getElementById('bot-home').classList.toggle('active', v === 'home');
            document.getElementById('bot-profile').classList.toggle('active', v === 'profile');
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
        }

        // 2. Auth Logic
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
                document.getElementById('userName').innerText = user.displayName || "User";
                document.getElementById('userEmail').innerText = user.email;
                if(user.photoURL) document.getElementById('userImg').src = user.photoURL;
                loadData();
            } else {
                document.getElementById('view-auth').classList.remove('hidden');
                document.getElementById('main-ui').classList.add('hidden');
            }
        });

        function handleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        function handleLogout() {
            auth.signOut().then(() => window.location.href = "index.html");
        }

        // 3. Data Logic
        async function loadData() {
            const snapshot = await db.collection('students').get();
            const home = document.getElementById('homeList');
            const att = document.getElementById('attList');
            const fees = document.getElementById('feesList');
            const rem = document.getElementById('removalList');
            
            home.innerHTML = ""; att.innerHTML = ""; fees.innerHTML = ""; rem.innerHTML = "";

            snapshot.forEach(doc => {
                const s = doc.data();
                const id = doc.id;
                home.innerHTML += `<tr><td>${s.name}</td><td>${s.class}</td><td>${s.admissionDate || 'N/A'}</td></tr>`;
                att.innerHTML += `<tr><td>${s.name}</td><td><input type="radio" name="att-${id}"></td><td><input type="radio" name="att-${id}"></td></tr>`;
                fees.innerHTML += `<tr><td>${s.name}</td><td id="f-${id}"><button onclick="payRow('${id}')">Mark Paid</button></td></tr>`;
                rem.innerHTML += `<div style="display:flex; justify-content:space-between; margin-top:10px;"><span>${s.name}</span><button onclick="deleteStudent('${id}')" style="background:var(--red); padding:5px 10px;">Remove</button></div>`;
            });
        }

        function payRow(id) {
            const date = new Date().toLocaleDateString();
            document.getElementById('f-'+id).innerHTML = `<span class="submitted-msg">Submitted on ${date}</span>`;
        }

        async function addStudent() {
            const name = document.getElementById('s-name').value;
            const cls = document.getElementById('s-class').value;
            const date = document.getElementById('s-date').value;
            if(!name || !cls || !date) return alert("Fill everything!");
            await db.collection('students').add({ name, class: cls, admissionDate: date });
            loadData();
        }

        async function deleteStudent(id) {
            if(confirm("Delete student?")) {
                await db.collection('students').doc(id).delete();
                loadData();
            }
        }
    </script>
</body>
</html>
