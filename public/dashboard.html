<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #bb86fc; --green: #03dac6; --red: #cf6679; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; overflow-x: hidden; }
        
        .hidden { display: none !important; }
        .section { display: none; }
        .section.active { display: block; }

        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .nav-item { color: var(--accent); font-weight: bold; cursor: pointer; padding: 8px 20px; border-radius: 8px; }
        .nav-item.active { background: #332940; color: white; box-shadow: 0 0 10px var(--accent); }
        .bottom-nav { background: #1f1b24; display: flex; justify-content: space-around; padding: 12px; border-top: 2px solid var(--accent); position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .bottom-item { color: var(--accent); font-weight: bold; cursor: pointer; text-align: center; flex: 1; opacity: 0.6; }
        .bottom-item.active { color: white; opacity: 1; }

        .sub-nav { display: flex; gap: 15px; margin-bottom: 20px; }
        .sub-item { color: var(--accent); cursor: pointer; font-size: 14px; padding: 5px 12px; border: 1px solid var(--accent); border-radius: 20px; }
        .sub-item.active { background: var(--accent); color: #000; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        
        .group-card { background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--accent); cursor: pointer; transition: 0.2s; }
        .group-card:hover { background: #2d2d2d; transform: scale(1.01); }

        input, button { background: #2c2c2c; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; margin: 5px; }
        input[type="radio"] { transform: scale(1.8); cursor: pointer; accent-color: var(--accent); margin-right: 8px; vertical-align: middle; }
        label { margin-right: 25px; cursor: pointer; } 
        
        button { background: var(--accent); color: #000; border: none; font-weight: bold; cursor: pointer; }
        .btn-submit-date { background: var(--green); color: #000; padding: 8px 15px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--accent); font-size: 13px; text-transform: uppercase; }
        .fees-done { color: var(--green); font-weight: bold; font-style: italic; }
        .history-card { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

    <div id="view-auth" class="hidden" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="card" style="text-align: center; width: 320px;">
            <h1 style="color: var(--accent);">Tuition Hub</h1>
            <button onclick="handleLogin()" style="background: white; color: black; width: 100%; padding: 15px;">Sign in with Google</button>
        </div>
    </div>

    <div id="view-setup" class="hidden">
        <div class="container">
            <h2 style="color: var(--accent);">Your Batches</h2>
            <div id="groupListContainer"></div>
            <div class="card" style="margin-top: 30px;">
                <h3>Start New or Join</h3>
                <input type="text" id="newGroupName" placeholder="Enter Batch Name" style="width: 60%;">
                <button onclick="createGroup()">Create</button>
                <hr style="border: 0.5px solid #444; margin: 20px 0;">
                <input type="text" id="joinCodeInput" placeholder="Enter Invite Code" style="width: 60%;">
                <button onclick="joinGroup()" style="background: var(--green);">Join</button>
            </div>
        </div>
    </div>

    <div id="main-ui" class="hidden">
        <div id="view-home">
            <div class="navbar">
                <div class="nav-item active" id="tab-students" onclick="showSection('students')">Students</div>
                <div class="nav-item" id="tab-attendance" onclick="showSection('attendance')">Attendance</div>
                <div class="nav-item" id="tab-fees" onclick="showSection('fees')">Fees Status</div>
                <div class="nav-item" style="color: var(--red);" onclick="exitGroup()">Switch Batch</div>
            </div>

            <div class="container">
                <h2 id="activeGroupName" style="color: var(--accent); margin-bottom: 20px;"></h2>

                <div id="section-students" class="section active">
                    <div class="card">
                        <h3>Register Student</h3>
                        <input type="text" id="s-name" placeholder="Name">
                        <input type="number" id="s-class" placeholder="Class">
                        <input type="date" id="s-date">
                        <button onclick="addStudent()">Register</button>
                    </div>
                    <div class="card">
                        <table><thead><tr><th>Name</th><th>Class</th><th>Date</th></tr></thead><tbody id="homeList"></tbody></table>
                    </div>
                </div>

                <div id="section-attendance" class="section">
                    <div class="sub-nav">
                        <div class="sub-item active" id="sub-today" onclick="switchAttBranch('today')">Today (<span id="currentDateDisplay"></span>)</div>
                        <div class="sub-item" id="sub-history" onclick="switchAttBranch('history')">History</div>
                    </div>
                    <div id="branch-today" class="att-branch">
                        <div class="card" style="display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;">
                            <div style="flex: 3; min-width: 300px;">
                                <table><thead><tr><th>Name</th><th style="text-align:center;">P</th><th style="text-align:center;">A</th></tr></thead><tbody id="attList"></tbody></table>
                            </div>
                            <button id="submit-att-btn" onclick="submitAttendance()" style="flex: 1; background: var(--green); padding: 30px; font-size: 20px; border-radius: 12px; min-width: 200px;">Submit</button>
                        </div>
                    </div>
                    <div id="branch-history" class="att-branch hidden">
                        <div id="historyLogs">No attendance history yet.</div>
                    </div>
                </div>

                <div id="section-fees" class="section">
                    <div class="card">
                        <h3>Fees Tracker</h3>
                        <table><thead><tr><th>Name</th><th>Status</th></tr></thead><tbody id="feesList"></tbody></table>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-profile" class="hidden">
            <div class="container">
                <div class="card" style="text-align: center;">
                    <img id="userImg" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 10px;">
                    <h2 id="userNameDisplay"></h2>
                    <button onclick="handleLogout()" style="background: var(--red); color: white; width: 100%;">Logout Account</button>
                </div>
                <div class="card">
                    <h3>Remove Students</h3>
                    <div id="removalList">Loading...</div>
                </div>
                <div class="card">
                    <h3>Batch Join Codes</h3>
                    <div id="profileGroupList"></div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="bottom-item active" id="bot-home" onclick="switchView('home')">🏠<br>Home</div>
            <div class="bottom-item" id="bot-profile" onclick="switchView('profile')">👤<br>Profile</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDH9vfqKh16tka_14deuwWzYDQR-2TvR_U",
            authDomain: "tuituionhub.firebaseapp.com",
            projectId: "tuituionhub",
            storageBucket: "tuituionhub.firebasestorage.app",
            messagingSenderId: "373410141090",
            appId: "1:373410141090:web:45144c02501738c31798fb"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let activeGroupID = null;
        document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('userNameDisplay').innerText = user.displayName;
                if(user.photoURL) document.getElementById('userImg').src = user.photoURL;
                loadUserGroups(); 
            } else {
                document.getElementById('view-auth').classList.remove('hidden');
                document.getElementById('view-setup').classList.add('hidden');
                document.getElementById('main-ui').classList.add('hidden');
            }
        });

        async function loadUserGroups() {
            const snapshot = await db.collection('members').where('uid', '==', auth.currentUser.uid).get();
            const groupList = document.getElementById('groupListContainer');
            const profileList = document.getElementById('profileGroupList');
            groupList.innerHTML = ""; profileList.innerHTML = "";
            if (snapshot.empty && !activeGroupID) { document.getElementById('view-setup').classList.remove('hidden'); return; }
            snapshot.forEach(async (memberDoc) => {
                const groupDoc = await db.collection('groups').doc(memberDoc.data().groupId).get();
                const data = groupDoc.data();
                const card = `<div class="group-card" onclick="enterGroup('${groupDoc.id}', '${data.name}')"><span>${data.name}</span><small style="color: var(--accent);">CODE: ${data.code}</small></div>`;
                groupList.innerHTML += card; profileList.innerHTML += card;
            });
            if (!activeGroupID) document.getElementById('view-setup').classList.remove('hidden');
        }

        async function createGroup() {
            const name = document.getElementById('newGroupName').value;
            if(!name) return alert("Batch name required!");
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            const groupRef = await db.collection('groups').add({ name, code, owner: auth.currentUser.uid });
            await db.collection('members').add({ uid: auth.currentUser.uid, groupId: groupRef.id });
            location.reload();
        }

        async function joinGroup() {
            const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
            const snapshot = await db.collection('groups').where('code', '==', code).get();
            if(snapshot.empty) return alert("Invalid Code!");
            await db.collection('members').add({ uid: auth.currentUser.uid, groupId: snapshot.docs[0].id });
            location.reload();
        }

        async function enterGroup(id, name) {
            activeGroupID = id;
            document.getElementById('activeGroupName').innerText = name;
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            
            await checkTodayAttendance(); 
            loadData();
        }

        function exitGroup() { activeGroupID = null; loadUserGroups(); document.getElementById('main-ui').classList.add('hidden'); }

        async function checkTodayAttendance() {
            const today = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
            const btn = document.getElementById('submit-att-btn');
            const snapshot = await db.collection('attendance')
                                     .where('groupId', '==', activeGroupID)
                                     .where('date', '==', today)
                                     .get();
            if (!snapshot.empty) {
                btn.innerText = "Submitted";
                btn.style.background = "#333";
                btn.disabled = true;
            } else {
                btn.innerText = "Submit";
                btn.style.background = "var(--green)";
                btn.disabled = false;
            }
        }

        async function loadData() {
            const today = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
            const attCheck = await db.collection('attendance')
                                     .where('groupId', '==', activeGroupID)
                                     .where('date', '==', today)
                                     .get();
            const isLocked = !attCheck.empty;

            const snapshot = await db.collection('students').where('groupId', '==', activeGroupID).get();
            const home = document.getElementById('homeList');
            const att = document.getElementById('attList');
            const fees = document.getElementById('feesList');
            const rem = document.getElementById('removalList');
            home.innerHTML = ""; att.innerHTML = ""; fees.innerHTML = ""; rem.innerHTML = "";

            snapshot.forEach(doc => {
                const s = doc.data();
                const id = doc.id;
                const displayDate = s.admissionDate ? s.admissionDate.split('-').reverse().join('-') : 'N/A';
                
                home.innerHTML += `<tr><td>${s.name}</td><td>${s.class}</td><td>${displayDate}</td></tr>`;
                
                const disabledAttr = isLocked ? "disabled" : "";
                att.innerHTML += `<tr><td>${s.name}</td>
                    <td style="text-align:center;"><input type="radio" name="at-${id}" id="p-${id}" ${disabledAttr}></td>
                    <td style="text-align:center;"><input type="radio" name="at-${id}" id="a-${id}" ${disabledAttr}></td></tr>`;
                
                fees.innerHTML += `<tr><td>${s.name}</td><td id="f-cont-${id}"><input type="radio" name="p-${id}" id="pd-${id}" onclick="toggleDateInput('${id}')"><label for="pd-${id}">Paid</label> <input type="radio" name="p-${id}" id="pn-${id}" checked><label for="pn-${id}">Pending</label></td></tr>`;
                rem.innerHTML += `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #333;"><span>${s.name}</span><button onclick="deleteStudent('${id}')" style="background:var(--red); color:white; padding:5px 12px; font-size:12px;">Remove</button></div>`;
            });
        }

        async function deleteStudent(id) {
            if(confirm("Permanently remove this student?")) {
                await db.collection('students').doc(id).delete();
                loadData();
            }
        }

        function toggleDateInput(id) {
            document.getElementById('f-cont-' + id).innerHTML = `<input type="date" id="date-${id}" style="color-scheme:dark;"><button class="btn-submit-date" onclick="submitFees('${id}')">Submit</button>`;
        }

        function submitFees(id) {
            const dateVal = document.getElementById('date-' + id).value;
            if (!dateVal) return alert("Pick a date!");
            document.getElementById('f-cont-' + id).innerHTML = `<span class="fees-done">Fees is submitted on ${dateVal.split('-').reverse().join('-')}</span>`;
        }

        async function submitAttendance() {
            const today = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
            const records = [];
            const snapshot = await db.collection('students').where('groupId', '==', activeGroupID).get();
            
            snapshot.forEach(doc => {
                const id = doc.id;
                const pRadio = document.getElementById(`p-${id}`);
                const aRadio = document.getElementById(`a-${id}`);
                let status = "Not Marked";
                if (pRadio && pRadio.checked) status = "Present";
                if (aRadio && aRadio.checked) status = "Absent";
                records.push({ name: doc.data().name, status });
                if(pRadio) pRadio.disabled = true;
                if(aRadio) aRadio.disabled = true;
            });

            if(records.length === 0) return alert("No students in this batch!");

            await db.collection('attendance').add({ 
                date: today, 
                groupId: activeGroupID, 
                records, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp() 
            });

            const btn = document.getElementById('submit-att-btn');
            btn.innerText = "Submitted"; btn.style.background = "#333"; btn.disabled = true;
            
            loadAttendanceHistory();
            alert("Attendance recorded!");
        }

        async function loadAttendanceHistory() {
            const logDiv = document.getElementById('historyLogs');
            const snapshot = await db.collection('attendance')
                                     .where('groupId', '==', activeGroupID)
                                     .orderBy('timestamp', 'desc')
                                     .get();
            if(snapshot.empty) { logDiv.innerHTML = "No attendance history yet."; return; }
            logDiv.innerHTML = "";
            snapshot.forEach(doc => {
                const d = doc.data();
                let html = `<div class="history-card"><strong>${d.date}</strong><hr style="border:0.5px solid #444; margin:8px 0;">`;
                d.records.forEach(r => {
                    const color = r.status === 'Present' ? 'var(--green)' : (r.status === 'Absent' ? 'var(--red)' : '#888');
                    html += `<div>${r.name}: <span style="color:${color}">${r.status}</span></div>`;
                });
                logDiv.innerHTML += html + `</div>`;
            });
        }

        function switchAttBranch(b) {
            document.getElementById('branch-today').classList.toggle('hidden', b !== 'today');
            document.getElementById('branch-history').classList.toggle('hidden', b !== 'history');
            document.getElementById('sub-today').classList.toggle('active', b === 'today');
            document.getElementById('sub-history').classList.toggle('active', b === 'history');
            if(b === 'history') loadAttendanceHistory();
        }

        async function addStudent() {
            const nameInput = document.getElementById('s-name');
            const classInput = document.getElementById('s-class');
            const dateInput = document.getElementById('s-date');
            const regBtn = event.target;

            const name = nameInput.value;
            const cls = classInput.value;
            const date = dateInput.value;

            if (!name || !cls || !date) return alert("Fill all details!");

            regBtn.disabled = true;
            regBtn.innerText = "Registering...";

            try {
                await db.collection('students').add({
                    name, class: cls, admissionDate: date, groupId: activeGroupID
                });
                nameInput.value = ""; classInput.value = ""; dateInput.value = "";
                loadData();
            } catch (e) {
                alert("Failed to register.");
            } finally {
                regBtn.disabled = false;
                regBtn.innerText = "Register";
            }
        }

        function handleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function handleLogout() { auth.signOut().then(() => window.location.href = "index.html"); }
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
        }
        function switchView(v) {
            document.getElementById('view-home').classList.toggle('hidden', v !== 'home');
            document.getElementById('view-profile').classList.toggle('hidden', v !== 'profile');
            document.getElementById('bot-home').classList.toggle('active', v === 'home');
            document.getElementById('bot-profile').classList.toggle('active', v === 'profile');
            if(v === 'profile') loadData(); 
        }
    </script>
</body>
</html>
