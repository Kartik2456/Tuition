<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #bb86fc; --green: #03dac6; --red: #cf6679; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; }
        .hidden { display: none !important; }
        .section { display: none; }
        .section.active { display: block; }

        .navbar { background: #1f1b24; display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .nav-item { color: var(--accent); font-weight: bold; cursor: pointer; padding: 8px 20px; border-radius: 8px; }
        .nav-item.active { background: #332940; color: white; box-shadow: 0 0 10px var(--accent); }

        .bottom-nav { background: #1f1b24; display: flex; justify-content: space-around; padding: 12px; border-top: 2px solid var(--accent); position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .bottom-item { color: var(--accent); font-weight: bold; cursor: pointer; text-align: center; flex: 1; opacity: 0.6; }
        .bottom-item.active { color: white; opacity: 1; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; }
        
        input, button { background: #2c2c2c; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; margin: 5px; }
        input[type="radio"] { transform: scale(1.6); cursor: pointer; accent-color: var(--accent); margin-right: 5px; vertical-align: middle; }
        label { margin-right: 15px; cursor: pointer; }
        
        button { background: var(--accent); color: #000; border: none; font-weight: bold; cursor: pointer; }
        .btn-submit-date { background: var(--green); color: #000; padding: 8px 15px; margin-left: 10px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--accent); font-size: 13px; text-transform: uppercase; }
        .fees-done { color: var(--green); font-weight: bold; font-style: italic; }
    </style>
</head>
<body>

    <div id="view-auth" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="card" style="text-align: center; width: 320px;">
            <h1 style="color: var(--accent);">Tuition Hub</h1>
            <button onclick="handleLogin()" style="background: white; color: black; width: 100%; padding: 15px;">Sign in with Google</button>
        </div>
    </div>

    <div id="main-ui" class="hidden">
        <div id="view-home">
            <div class="navbar">
                <div class="nav-item active" id="tab-students" onclick="showSection('students')">Students</div>
                <div class="nav-item" id="tab-attendance" onclick="showSection('attendance')">Attendance</div>
                <div class="nav-item" id="tab-fees" onclick="showSection('fees')">Fees Status</div>
            </div>

            <div class="container">
                <div id="section-students" class="section active">
                    <div class="card">
                        <h3>Register Student</h3>
                        <input type="text" id="s-name" placeholder="Name">
                        <input type="number" id="s-class" placeholder="Class">
                        <input type="date" id="s-date">
                        <button onclick="addStudent()">Register</button>
                    </div>
                    <div class="card">
                        <h3>Student List</h3>
                        <table><thead><tr><th>Name</th><th>Class</th><th>Adm. Date</th></tr></thead><tbody id="homeList"></tbody></table>
                    </div>
                </div>

                <div id="section-attendance" class="section">
                    <div class="card">
                        <h3>Today's Attendance</h3>
                        <table><thead><tr><th>Name</th><th>P</th><th>A</th></tr></thead><tbody id="attList"></tbody></table>
                        <button style="background: var(--green); width: 100%; margin-top: 20px; padding: 15px;">Submit Attendance</button>
                    </div>
                </div>

                <!-- FIXED FEES SECTION PER YOUR REQUEST -->
                <div id="section-fees" class="section">
                    <div class="card">
                        <h3>Fees Management</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Status Selection</th>
                                    <th>Payment Details</th>
                                </tr>
                            </thead>
                            <tbody id="feesList"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-profile" class="hidden">
            <div class="container">
                <div class="card" style="text-align: center;">
                    <img id="userImg" style="width: 100px; border-radius: 50%; border: 3px solid var(--accent);">
                    <h2 id="userName"></h2>
                    <button onclick="handleLogout()" style="background: var(--red); color: white; width: 100%; margin-top: 20px;">Logout</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="bottom-item active" id="bot-home" onclick="switchView('home')">🏠<br>Home</div>
            <div class="bottom-item" id="bot-profile" onclick="switchView('profile')">👤<br>Profile</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDH9vfqKh16tka_14deuwWzYDQR-2TvR_U",
            authDomain: "tuituionhub.firebaseapp.com",
            projectId: "tuituionhub",
            storageBucket: "tuituionhub.firebasestorage.app",
            messagingSenderId: "373410141090",
            appId: "1:373410141090:web:45144c02501738c31798fb"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
        }

        function switchView(view) {
            document.getElementById('view-home').classList.toggle('hidden', view !== 'home');
            document.getElementById('view-profile').classList.toggle('hidden', view !== 'profile');
            document.getElementById('bot-home').classList.toggle('active', view === 'home');
            document.getElementById('bot-profile').classList.toggle('active', view === 'profile');
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
                document.getElementById('userName').innerText = user.displayName;
                if(user.photoURL) document.getElementById('userImg').src = user.photoURL;
                loadData();
            } else {
                document.getElementById('view-auth').classList.remove('hidden');
                document.getElementById('main-ui').classList.add('hidden');
            }
        });

        function handleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function handleLogout() { auth.signOut().then(() => window.location.href = "index.html"); }

        async function loadData() {
            const snapshot = await db.collection('students').get();
            const home = document.getElementById('homeList');
            const att = document.getElementById('attList');
            const fees = document.getElementById('feesList');

            home.innerHTML = ""; att.innerHTML = ""; fees.innerHTML = "";

            snapshot.forEach(doc => {
                const s = doc.data();
                const id = doc.id;
                home.innerHTML += `<tr><td>${s.name}</td><td>${s.class}</td><td>${s.admissionDate}</td></tr>`;
                att.innerHTML += `<tr><td>${s.name}</td><td><input type="radio" name="at-${id}"></td><td><input type="radio" name="at-${id}"></td></tr>`;
                
                // FEES ROW LOGIC
                fees.innerHTML += `
                    <tr>
                        <td>${s.name}</td>
                        <td id="status-cell-${id}">
                            <input type="radio" name="pay-${id}" id="p-${id}" onclick="toggleDateInput('${id}', true)"><label for="p-${id}">Paid</label>
                            <input type="radio" name="pay-${id}" id="pn-${id}" onclick="toggleDateInput('${id}', false)" checked><label for="pn-${id}">Pending</label>
                        </td>
                        <td id="details-cell-${id}"></td>
                    </tr>`;
            });
        }

        function toggleDateInput(id, isPaid) {
            const detailCell = document.getElementById('details-cell-' + id);
            if (isPaid) {
                detailCell.innerHTML = `
                    <input type="date" id="date-${id}" style="color-scheme:dark;">
                    <button class="btn-submit-date" onclick="submitFees('${id}')">Submit Date</button>
                `;
            } else {
                detailCell.innerHTML = "";
            }
        }

        function submitFees(id) {
            const dateVal = document.getElementById('date-' + id).value;
            if (!dateVal) return alert("Select a date first!");
            
            // Transform the entire row area to the final text
            const statusCell = document.getElementById('status-cell-' + id);
            const detailCell = document.getElementById('details-cell-' + id);
            
            statusCell.innerHTML = `<span class="fees-done">Fees is submitted on ${dateVal}</span>`;
            detailCell.innerHTML = ""; 
            // In a real app, you'd save 'dateVal' to Firestore here.
        }

        async function addStudent() {
            const name = document.getElementById('s-name').value;
            const cls = document.getElementById('s-class').value;
            const date = document.getElementById('s-date').value;
            if(!name || !cls || !date) return alert("Fill all!");
            await db.collection('students').add({ name, class: cls, admissionDate: date });
            loadData();
        }
    </script>
</body>
</html>
