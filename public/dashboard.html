<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Hub | Management</title>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --accent: #bb86fc; --card: #1e1e1e; --bg: #121212; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        
        /* THE FIX: This class hides the login box once you're in */
        .hidden { display: none !important; }

        .auth-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid var(--accent); text-align: center; }
        
        /* Your Dashboard Design Styles */
        .nav-item { color: var(--accent); font-weight: bold; padding: 10px; cursor: pointer; }
        .student-item { display: flex; justify-content: space-between; background: var(--card); margin: 10px; padding: 15px; border-radius: 8px; }
        .del-btn { background: #cf6679; color: white; border: none; padding: 5px 10px; border-radius: 4px; }
        
        /* Bottom Nav from your image_8ec3ff.png */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; border-top: 2px solid var(--accent); }
    </style>
</head>
<body>

    <!-- 1. THE LOGIN BOX (The one that was "stuck") -->
    <div id="view-auth" class="auth-screen">
        <div class="card">
            <h1>Tuition Hub</h1>
            <p>Please sign in to continue</p>
            <button onclick="handleLogin()" style="background: white; color: black; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer;">
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- 2. THE ACTUAL CONTENT (Hidden until login) -->
    <div id="main-ui" class="hidden">
        <div style="padding: 20px;">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                <img id="userImg" style="width: 50px; border-radius: 50%; border: 2px solid var(--accent);">
                <div>
                    <h2 id="userName" style="margin: 0;"></h2>
                    <p id="userEmail" style="margin: 0; opacity: 0.7; font-size: 12px;"></p>
                </div>
            </div>

            <h3>Student List</h3>
            <div id="mainStudentList"></div>
            
            <button onclick="handleLogout()" style="margin-top: 20px; color: #cf6679; background: none; border: 1px solid #cf6679; padding: 8px; cursor: pointer;">Logout</button>
        </div>

        <!-- Your Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item">Home</div>
            <div class="nav-item">Students</div>
            <div class="nav-item">Fees</div>
            <div class="nav-item">Settings</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDH9vfqKh16tka_14deuwWzYDQR-2TvR_U",
            authDomain: "tuituionhub.firebaseapp.com",
            projectId: "tuituionhub",
            storageBucket: "tuituionhub.firebasestorage.app",
            messagingSenderId: "373410141090",
            appId: "1:373410141090:web:45144c02501738c31798fb",
            measurementId: "G-XPS2L1NZ2V"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // AUTH LISTENER: This is what swaps the "box" for the "stuff"
        auth.onAuthStateChanged(user => {
            const authView = document.getElementById('view-auth');
            const mainView = document.getElementById('main-ui');

            if (user) {
                authView.classList.add('hidden'); // Hide the login box
                mainView.classList.remove('hidden'); // Show your dashboard
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('userImg').src = user.photoURL || '';
                loadData(); 
            } else {
                authView.classList.remove('hidden');
                mainView.classList.add('hidden');
            }
        });

        function handleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert(err.message));
        }

        function handleLogout() {
            auth.signOut().then(() => window.location.href = "index.html");
        }

        async function loadData() {
            const snapshot = await db.collection('students').get();
            const list = document.getElementById('mainStudentList');
            list.innerHTML = "";
            snapshot.forEach(doc => {
                const s = doc.data();
                list.innerHTML += `<div class="student-item"><span>${s.name}</span> <button class="del-btn">Delete</button></div>`;
            });
        }
    </script>
</body>
</html>
